# Builds cashpilot.club and deploys it to GitHub Pages.
# Runs on every push to main, once a day (so star counts, Docker pulls and the
# catalog stay current) and on demand. New releases reach the site through the
# PRs of bump-pins.yml.
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # --strict: a published locale must have every key, so it never shows
      # English halfway through a page. --all: every one of the 20 locales
      # must have its file, so a lost file fails here and not in production.
      - name: Check translations
        run: bun run i18n:check --strict --all

      - name: Build
        run: bun run build
        env:
          # Read-only token, only to lift the API rate limit for the build-time data.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
