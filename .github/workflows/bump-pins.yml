# Opens a PR that moves the pinned download links (src/data/pins.json) to the
# latest CashPilot, CashPilot Desktop and CashPilot Android releases, after
# every linked file answers HTTP 200. Runs every hour, on demand, and when a
# sibling repo sends a `release` repository_dispatch after it publishes.
name: Bump pinned releases

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: read

concurrency:
  group: bump-pins
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Starts ci.yml on the new branch: a PR opened with this token starts no
      # pull_request run, so the PR would wait for its required check forever.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Check the latest releases and their files
        id: bump
        # A release with a missing file fails this step. The steps below still
        # open a PR for the repos whose files all answered 200.
        continue-on-error: true
        run: bun scripts/bump-pins.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open the PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: bot/pins-${{ steps.bump.outputs.slug }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            # The branch is there. A merged or closed PR means we are done. An open
            # PR whose head has no build check gets its CI started again. No PR
            # means an earlier run pushed the branch and then failed: open it now.
            state=$(gh pr list --head "$BRANCH" --state all --json state --jq '.[0].state // ""')
            if [ "$state" = OPEN ]; then
              runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH/check-runs" --jq '[.check_runs[] | select(.name == "build")] | length')
              [ "$runs" = 0 ] && gh workflow run ci.yml --ref "$BRANCH"
              echo "$BRANCH has an open PR"
              exit 0
            elif [ -n "$state" ]; then
              echo "$BRANCH has a $state PR"
              exit 0
            fi
          else
            git config user.name GeiserX
            git config user.email 9169332+GeiserX@users.noreply.github.com
            git switch -c "$BRANCH"
            git add src/data/pins.json
            git commit -m "chore(downloads): pin the latest releases" -m "$(cat bump-summary.md)"
            git push origin "$BRANCH"
          fi
          {
            echo "New releases are out. This PR points the site's download links at them."
            echo
            cat bump-summary.md
            echo
            echo "Before opening this PR, the workflow fetched every file the site links for these releases, and each one answered HTTP 200. Merge it to deploy."
          } > body.md
          url=$(gh pr create --base main --head "$BRANCH" --title "chore(downloads): point the download links at the new releases" --body-file body.md)
          # An older bump PR that was never merged is out of date now.
          for n in $(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/pins-")) | select(.headRefName != env.BRANCH) | .number'); do
            gh pr close "$n" --delete-branch --comment "Superseded by $url"
          done
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Fail when a release could not be pinned
        if: steps.bump.outcome == 'failure'
        run: |
          echo "::error::A new release has a missing file and was not pinned. The log of the check step names the file."
          exit 1
